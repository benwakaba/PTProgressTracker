name: PTProgressTracker
options:
  bundleIdPrefix: com.benwakaba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  PTProgressTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PTProgressTracker
      - path: PTProgressTracker.xcdatamodeld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benwakaba.PTProgressTracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PT Progress
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - PTProgressTrackerTests
      commandLineArguments: []

  PTProgressTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PTProgressTrackerTests
    dependencies:
      - target: PTProgressTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benwakaba.PTProgressTrackerTests
        GENERATE_INFOPLIST_FILE: YES
